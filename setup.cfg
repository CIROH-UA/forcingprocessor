[metadata]
name = forcingprocessor
version = attr: forcingprocessor._version.__version__
author = Jordan J. Laser
author_email = jlaser@lynker.com
description = Tool to convert nwm forcing netcdfs to ngen compatible files
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8
license = USDOC
license_files =
    LICENSE
url = https://github.com/CIROH-UA/forcingprocessor
project_urls =
    Source = https://github.com/CIROH-UA/forcingprocessor
    Tracker = https://github.com/CIROH-UA/forcingprocessor/issues
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Education
    Intended Audience :: Science/Research
    License :: Free To Use But Restricted
    Programming Language :: Python :: 3.11
    Topic :: Scientific/Engineering :: Hydrology
    Operating System :: OS Independent

[options]
packages = find_namespace:
package_dir =
    =src
install_requires =
    boto3>=1.43.56
    cftime>=1.6.5
    dask>=2026.7.1
    exactextract>=0.3.0
    gcsfs>=2026.7.0,<2026.8.0
    geopandas>=1.1.4
    imageio>=2.37.4
    matplotlib>=3.11.1
    netCDF4>=1.7.4
    h5netcdf>=1.8.1
    h5py>=3.16.0
    nwmurl>=1.0.8
    pandas>=3.0.5
    psutil>=7.2.2
    pyarrow>=25.0.1
    pyogrio>=0.13.0
    requests>=2.34.2
    s3fs>=2026.7.0
    scipy>=1.17.1
    xarray>=2026.7.0

python_requires = >=3.11
include_package_data = True

[options.packages.find]
where = src

[options.extras_require]
develop =
    pytest>=9.1.1
